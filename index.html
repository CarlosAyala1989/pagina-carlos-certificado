
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Digital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            background-color: white;
            padding: 55px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .icono {
            font-size: 65px;
            margin-bottom: 25px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .linea {
            width: 100px;
            height: 4px;
            background-color: #3b82f6;
            margin: 20px auto;
            border-radius: 5px;
        }

        h2 {
            color: #334155;
            font-size: 26px;
            margin-top: 25px;
        }

        .pie {
            color: #64748b;
            font-size: 14px;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="icono">🔐</div>

        <h1>Certificado Digital</h1>

        <div class="linea"></div>

        <h2>Carlos Daniel Ayala Ramos</h2>

        <p class="pie">
            Seguridad y Certificación Digital
        </p>

    </div>

</body>
</html>
